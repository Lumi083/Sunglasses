name: Build Desktop

on:
  push:
    branches: [web]
  pull_request:
    branches: [web]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript
        run: npm run check

      - name: Build package
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: sunglasses-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
